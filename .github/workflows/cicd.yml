name: CI/CD Pipeline with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 🧪 1단계: 빌드 및 테스트
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐싱 (빌드 속도 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Backend 빌드
      - name: Build with Gradle
        working-directory: ./backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
        continue-on-error: false  # 빌드 실패 시 파이프라인 중단

      # 5. Backend 테스트 실행
      - name: Run Backend Tests
        working-directory: ./backend
        run: ./gradlew test
        continue-on-error: false  # 테스트 실패 시 파이프라인 중단

      # 6. 테스트 결과 업로드
      - name: Publish Test Results
        if: always()  # 테스트 실패해도 결과는 업로드
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/test-results/

      # 7. 테스트 커버리지 확인 (선택사항)
      - name: Generate Test Coverage Report
        if: success()
        working-directory: ./backend
        run: ./gradlew jacocoTestReport
        continue-on-error: true

  # 🚀 2단계: 배포
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # 빌드/테스트 성공 후에만 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. .env 파일 생성
      - name: Create .env file
        run: |
          # 루트 .env (docker-compose.yml에서 사용)
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}" >> .env
          echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" >> .env
          echo "WEBSOCKET_ALLOWED_ORIGINS=${{ secrets.WEBSOCKET_ALLOWED_ORIGINS }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          # frontend/.env (frontend/src/shared/api/axiosConfig.js에서 사용)
          echo "VITE_API_SERVER_HOST=${{ secrets.ALLOWED_ORIGIN }}" >> frontend/.env
        
      # 3. EC2로 파일 전송 (플러그인-https://github.com/appleboy/ssh-action)
      - name: Copy file to EC2
        uses: appleboy/scp-action@v1
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./*"
          target: "/home/ubuntu/website"
          rm: false
        
      # 4. EC2에서 Docker Compose 실행 with 롤백 전략
      - name: Deploy with Docker Compose on EC2
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # 스크립트 오류 시 즉시 중단

            # website 디렉터리로 이동
            cd /home/ubuntu/website

            # 🔖 현재 실행 중인 이미지 백업 (롤백용)
            echo "📸 현재 이미지 백업 중..."
            docker tag final_project_coreconnect-backend:latest final_project_coreconnect-backend:backup || true
            docker tag final_project_coreconnect-frontend:latest final_project_coreconnect-frontend:backup || true

            # 🛑 기존 컨테이너 중지
            echo "🛑 기존 컨테이너 중지 중..."
            docker compose down --remove-orphans || true

            # 🗑️ 사용하지 않는 이미지 삭제
            docker image prune -f

            # 🚀 새 버전 배포
            echo "🚀 새 버전 배포 시작..."
            if ! docker compose up --build -d; then
              echo "❌ 배포 실패! 롤백 시작..."
              # 롤백: 백업 이미지로 복구
              docker tag final_project_coreconnect-backend:backup final_project_coreconnect-backend:latest
              docker tag final_project_coreconnect-frontend:backup final_project_coreconnect-frontend:latest
              docker compose up -d
              exit 1
            fi

            # ⏳ 컨테이너 시작 대기
            echo "⏳ 컨테이너 시작 대기 중..."
            sleep 10

            # 🏥 헬스체크 스크립트 실행
            echo "🏥 헬스체크 시작..."
            chmod +x scripts/healthcheck.sh

            if ! ./scripts/healthcheck.sh --max-retries 30 --interval 2 --timeout 120; then
              echo "❌ 헬스체크 실패! 롤백 시작..."
              # 롤백: 백업 이미지로 복구
              docker compose down
              docker tag final_project_coreconnect-backend:backup final_project_coreconnect-backend:latest
              docker tag final_project_coreconnect-frontend:backup final_project_coreconnect-frontend:latest
              docker compose up -d
              docker compose logs --tail=100
              exit 1
            fi

            echo "✅ 배포 및 헬스체크 완료!"
            docker compose logs --tail=50

      # 5. 배포 성공 알림 (선택사항 - Slack/Discord)
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ 배포 성공!"
          # Slack 알림을 원하면 secrets.SLACK_WEBHOOK_URL 설정 후 주석 해제
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ CoreConnect 배포 성공! Commit: ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

      # 6. 배포 실패 알림
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ 배포 실패! 롤백이 수행되었습니다."
          # Slack 알림을 원하면 secrets.SLACK_WEBHOOK_URL 설정 후 주석 해제
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"❌ CoreConnect 배포 실패! Commit: ${{ github.sha }}\n롤백이 수행되었습니다."}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}