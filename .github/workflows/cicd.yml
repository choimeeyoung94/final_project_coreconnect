name: CI/CD Pipeline with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. .env 파일 생성
      - name: Create .env file
        run: |
          # 루트 .env (docker-compose.yml에서 사용)
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}" >> .env
          echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" >> .env
          echo "WEBSOCKET_ALLOWED_ORIGINS=${{ secrets.WEBSOCKET_ALLOWED_ORIGINS }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          # frontend/.env (frontend/src/shared/api/axiosConfig.js에서 사용)
          echo "VITE_API_SERVER_HOST=${{ secrets.ALLOWED_ORIGIN }}" >> frontend/.env
        
      # 3-1. Secrets 확인 (디버깅용 - 실제 값은 출력되지 않음)
      - name: Verify Secrets Configuration
        run: |
          echo "🔍 Secrets 설정 확인 중..."
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ EC2_HOST가 설정되지 않았습니다!"
            exit 1
          fi
          echo "✅ EC2_HOST: 설정됨"
          
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ EC2_USER가 설정되지 않았습니다!"
            exit 1
          fi
          echo "✅ EC2_USER: 설정됨"
          
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ EC2_SSH_KEY가 설정되지 않았습니다!"
            exit 1
          fi
          echo "✅ EC2_SSH_KEY: 설정됨"
          
          echo "📝 EC2_HOST 값 확인 (마스킹됨): ${{ secrets.EC2_HOST }}"
          echo "📝 EC2_USER 값: ${{ secrets.EC2_USER }}"
      
      # 3-2. 네트워크 진단 (디버깅용)
      - name: Network Diagnostics
        run: |
          echo "🔍 네트워크 진단 시작..."
          echo ""

          # GitHub Actions Runner의 Public IP 확인
          echo "📍 GitHub Actions Runner IP 주소:"
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "✅ Runner IP: $RUNNER_IP"
          echo "⚠️ EC2 보안 그룹에서 이 IP를 SSH(22) 포트에 허용해야 합니다!"
          echo ""

          # EC2 호스트 확인
          echo "📍 EC2 호스트: ${{ secrets.EC2_HOST }}"
          echo ""

          # DNS 조회
          echo "🌐 DNS 조회:"
          if nslookup ${{ secrets.EC2_HOST }}; then
            echo "✅ DNS 조회 성공"
          else
            echo "❌ DNS 조회 실패 - EC2_HOST가 올바른지 확인하세요"
          fi
          echo ""

          # Ping 테스트
          echo "🏓 Ping 테스트 (4회):"
          if ping -c 4 -W 5 ${{ secrets.EC2_HOST }}; then
            echo "✅ Ping 성공 - 네트워크 연결 가능"
          else
            echo "❌ Ping 실패 - EC2 보안 그룹에서 ICMP를 차단 중이거나 인스턴스가 중지됨"
          fi
          echo ""

          # 포트 22 연결 테스트
          echo "🔌 포트 22 연결 테스트:"
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/22" 2>/dev/null; then
            echo "✅ 포트 22 연결 가능!"
          else
            echo "❌ 포트 22 연결 불가!"
            echo "원인 가능성:"
            echo "  1. EC2 보안 그룹에서 SSH(22) 포트가 $RUNNER_IP 에 대해 차단됨"
            echo "  2. EC2 인스턴스가 중지됨"
            echo "  3. 네트워크 ACL 문제"
            echo ""
            echo "해결 방법:"
            echo "  AWS Console → EC2 → 보안 그룹 → 인바운드 규칙"
            echo "  - 유형: SSH, 포트: 22, 소스: $RUNNER_IP/32 또는 0.0.0.0/0"
          fi
          echo ""

          # Traceroute (경로 추적)
          echo "🗺️ Traceroute (최대 15홉):"
          traceroute -m 15 -w 2 ${{ secrets.EC2_HOST }} || echo "⚠️ Traceroute 완료"
          echo ""

          # 최종 요약
          echo "========================================="
          echo "📊 진단 요약"
          echo "========================================="
          echo "Runner IP: $RUNNER_IP"
          echo "EC2 Host: ${{ secrets.EC2_HOST }}"
          echo ""
          echo "다음 단계에서 SSH 연결이 실패하면:"
          echo "1. EC2 보안 그룹에 Runner IP ($RUNNER_IP) 추가"
          echo "2. 또는 임시로 0.0.0.0/0 허용 (테스트용)"
          echo "========================================="

      # 3-3. SSH 연결 테스트 (디버깅용)
      - name: Test SSH Connection to EC2
        uses: appleboy/ssh-action@v1
        continue-on-error: true  # 실패해도 다음 단계 계속
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 5m
          debug: true
          script: |
            echo "✅ SSH 연결 테스트 성공!"
            hostname
            whoami
            echo "EC2 인스턴스에 정상적으로 연결되었습니다."
      
      # 3-4. EC2로 파일 전송 (재시도 로직 포함)
      - name: Copy file to EC2 (Attempt 1)
        id: scp-attempt-1
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 180s  # 타임아웃 3분으로 증가
          command_timeout: 10m  # 명령 타임아웃 10분
          debug: true
          source: "./*"
          target: "/home/ubuntu/website"
          rm: false
          overwrite: true

      - name: Wait before retry (if needed)
        if: steps.scp-attempt-1.outcome == 'failure'
        run: |
          echo "⚠️ 첫 번째 SCP 시도 실패. 10초 후 재시도..."
          sleep 10

      - name: Copy file to EC2 (Attempt 2)
        id: scp-attempt-2
        if: steps.scp-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 240s  # 타임아웃 4분으로 증가
          command_timeout: 15m
          debug: true
          source: "./*"
          target: "/home/ubuntu/website"
          rm: false
          overwrite: true

      - name: Wait before final retry (if needed)
        if: steps.scp-attempt-2.outcome == 'failure'
        run: |
          echo "⚠️ 두 번째 SCP 시도 실패. 20초 후 최종 재시도..."
          sleep 20

      - name: Copy file to EC2 (Final Attempt)
        if: steps.scp-attempt-2.outcome == 'failure'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s  # 타임아웃 5분으로 증가
          command_timeout: 20m
          debug: true
          source: "./*"
          target: "/home/ubuntu/website"
          rm: false
          overwrite: true
        
      # 4. EC2에서 Docker Compose 실행 (플러그인-https://github.com/appleboy/ssh-action)
      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22  # SSH 포트 명시적으로 지정
          timeout: 300s  # 타임아웃 5분으로 증가
          command_timeout: 30m  # 명령 타임아웃 30분
          debug: true  # 디버그 모드 활성화
          script: |
            set -e  # 에러 발생 시 즉시 중단
            
            # 에러 핸들러 함수 정의
            handle_error() {
              local exit_code=$?
              local line_number=$1
              echo "❌ 배포 중 에러 발생!"
              echo "📍 에러 위치: 라인 $line_number"
              echo "🔍 Exit Code: $exit_code"
              
              # 컨테이너 상태 확인
              echo ""
              echo "📊 컨테이너 상태:"
              docker ps -a || true
              
              # 컨테이너 로그 확인
              echo ""
              echo "📋 Backend 컨테이너 로그 (최근 100줄):"
              docker compose logs backend --tail=100 || true
              
              # 에러 패턴 검색 (Checked/Unchecked Exception)
              echo ""
              echo "🔍 예외 발생 로그 검색:"
              docker compose logs backend 2>&1 | grep -i -E "(exception|error|failed|fatal)" | tail -20 || true
              
              # 컨테이너 종료 상태 확인
              echo ""
              echo "📦 컨테이너 종료 상태:"
              docker compose ps -a || true
              
              # 롤백 시도 (이전 버전이 있다면)
              echo ""
              echo "🔄 롤백 시도 중..."
              docker compose down --remove-orphans || true
              
              exit $exit_code
            }
            
            # trap을 사용하여 에러 발생 시 handle_error 함수 호출
            trap 'handle_error $LINENO' ERR
            
            # website 디렉터리로 이동
            cd /home/ubuntu/website || { echo "❌ 디렉터리 이동 실패"; exit 1; }
            
            # 기존 컨테이너 백업 (롤백을 위해)
            echo "💾 기존 컨테이너 상태 백업..."
            docker compose ps -a > /tmp/previous_containers.txt 2>&1 || true
            
            # 기존 컨테이너 강제 중지 및 삭제
            echo "🛑 기존 컨테이너 중지 중..."
            docker compose down --remove-orphans || true
            docker rm -f boot-container nginx-container 2>/dev/null || true
            
            # 사용하지 않는 이미지 삭제
            echo "🧹 사용하지 않는 이미지 정리 중..."
            docker image prune -f || true
            
            # Docker Compose 빌드 및 실행
            echo "🔨 Docker Compose 빌드 및 실행 중..."
            if ! docker compose up --build -d; then
              echo "❌ Docker Compose 실행 실패"
              echo "📋 빌드 로그:"
              docker compose logs --tail=50 || true
              exit 1
            fi
            
            # 컨테이너가 정상적으로 시작되었는지 확인
            echo "⏳ 컨테이너 시작 대기 중..."
            sleep 5
            
            # 컨테이너 상태 확인
            echo "📊 컨테이너 상태 확인:"
            docker compose ps
            
            # 컨테이너가 실행 중인지 확인
            if ! docker compose ps | grep -q "Up"; then
              echo "❌ 컨테이너가 정상적으로 시작되지 않았습니다."
              echo "📋 컨테이너 로그:"
              docker compose logs --tail=50
              exit 1
            fi
            
            # Docker Compose 실행 로그 확인 (에러 패턴 검색)
            echo "📋 초기 로그 확인 중..."
            docker compose logs --tail=50
            
            # 애플리케이션 예외 발생 여부 확인
            echo "🔍 애플리케이션 예외 검사 중..."
            EXCEPTION_FOUND=$(docker compose logs backend 2>&1 | grep -i -E "(exception|error|failed|fatal)" | tail -5 || true)
            if [ -n "$EXCEPTION_FOUND" ]; then
              echo "⚠️  예외 로그 발견:"
              echo "$EXCEPTION_FOUND"
            fi

            # 헬스체크: 애플리케이션이 준비될 때까지 최대 2분 대기
            echo "🏥 헬스체크 시작..."
            RETRY_COUNT=0
            MAX_RETRIES=24  # 24회 * 5초 = 2분
            HEALTH_CHECK_FAILED=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              # 컨테이너가 여전히 실행 중인지 확인
              if ! docker compose ps | grep -q "Up"; then
                echo "❌ 컨테이너가 중지되었습니다."
                HEALTH_CHECK_FAILED=true
                break
              fi
              
              # 기본 헬스체크 (포트 확인)
              if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ 기본 헬스체크 성공"

                # 상세 헬스체크 (DB 연결 확인)
                if curl -f http://localhost:8080/api/health/detailed > /dev/null 2>&1; then
                  echo "✅ 상세 헬스체크 성공 (DB 연결 정상)"
                  
                  # 최종 예외 검사
                  FINAL_EXCEPTION_CHECK=$(docker compose logs backend 2>&1 | grep -i -E "(exception|error)" | tail -10 || true)
                  if [ -n "$FINAL_EXCEPTION_CHECK" ]; then
                    echo "⚠️  최종 예외 로그 확인:"
                    echo "$FINAL_EXCEPTION_CHECK"
                    # 경고만 출력하고 계속 진행 (애플리케이션이 동작 중이면)
                  fi
                  
                  echo "🎉 배포 완료! 서비스가 정상 작동 중입니다."
                  exit 0
                else
                  echo "⚠️  상세 헬스체크 실패 (DB 연결 오류 가능성)"
                  HEALTH_CHECK_FAILED=true
                  break
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "⏳ 헬스체크 재시도 ($RETRY_COUNT/$MAX_RETRIES)..."
              
              # 재시도 중 예외 발생 여부 확인
              if [ $((RETRY_COUNT % 5)) -eq 0 ]; then
                EXCEPTION_CHECK=$(docker compose logs backend 2>&1 | grep -i -E "(exception|error)" | tail -5 || true)
                if [ -n "$EXCEPTION_CHECK" ]; then
                  echo "⚠️  재시도 중 예외 발견:"
                  echo "$EXCEPTION_CHECK"
                fi
              fi
              
              sleep 5
            done

            # 헬스체크 실패 시 상세 정보 출력
            if [ "$HEALTH_CHECK_FAILED" = true ] || [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ 헬스체크 실패: 서비스가 시작되지 않았습니다."
              echo ""
              echo "📊 최종 컨테이너 상태:"
              docker compose ps -a
              echo ""
              echo "📋 Backend 로그 (최근 100줄):"
              docker compose logs backend --tail=100
              echo ""
              echo "🔍 예외/에러 로그 검색:"
              docker compose logs backend 2>&1 | grep -i -E "(exception|error|failed|fatal)" | tail -30 || true
              echo ""
              echo "📋 모든 서비스 로그:"
              docker compose logs --tail=50
              exit 1
            fi