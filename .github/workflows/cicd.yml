name: CI/CD Pipeline with Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_BACKEND: chat-service
  ECR_REPOSITORY_FRONTEND: chat-frontend
  K8S_NAMESPACE: chat-system

jobs:
  # ============================================
  # 1. 코드 검증 및 테스트 (PR 머지 전 검사)
  # ============================================
  test-and-validate:
    name: Code Validation & Testing
    runs-on: ubuntu-latest
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 설정 (Backend)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js 설정 (Frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. Backend 의존성 설치 및 빌드 검증
      - name: Build Backend
        working-directory: ./backend
        run: |
          chmod +x gradlew || true
          ./gradlew clean build -x test --no-daemon || ./gradlew clean build -x test --no-daemon

      # 5. Frontend 의존성 설치
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # 6. Frontend 빌드 검증
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # 7. Frontend 린터 검사 (ESLint)
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint || true
        continue-on-error: true

  # ============================================
  # 2. Docker 이미지 빌드 및 푸시 (ECR)
  # ============================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      image-tag: ${{ steps.vars.outputs.tag }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 이미지 태그 설정 (Git SHA 사용)
      - name: Set image tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "Image tag: ${GITHUB_SHA::8}"

      # 3. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Backend Docker 이미지 빌드 및 푸시
      - name: Build and push Backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        working-directory: ./backend
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # 6. Frontend Docker 이미지 빌드 및 푸시
      - name: Build and push Frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          VITE_API_SERVER_HOST: ${{ secrets.ALLOWED_ORIGIN }}
        working-directory: ./frontend
        run: |
          # .env 파일 생성
          echo "VITE_API_SERVER_HOST=$VITE_API_SERVER_HOST" > .env
          
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

  # ============================================
  # 3. Kubernetes 배포
  # ============================================
  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. kubectl 설치
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      # 4. Kubeconfig 설정 (EKS)
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # 5. ConfigMap 업데이트
      - name: Update ConfigMap
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: chat-config
            namespace: ${{ env.K8S_NAMESPACE }}
          data:
            DB_HOST: "${{ secrets.MYSQL_HOST }}"
            DB_PORT: "${{ secrets.MYSQL_PORT }}"
            DB_NAME: "${{ secrets.MYSQL_DATABASE }}"
            REDIS_HOST: "redis-service.${{ env.K8S_NAMESPACE }}.svc.cluster.local"
            REDIS_PORT: "6379"
            AWS_REGION: "${{ env.AWS_REGION }}"
            WEBSOCKET_ORIGINS: "${{ secrets.WEBSOCKET_ALLOWED_ORIGINS }}"
            JWT_EXPIRATION: "86400000"
            SECURITY_MODE: "secure"
            SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
            CORS_ALLOWED_ORIGINS: "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          EOF

      # 6. Secret 업데이트
      - name: Update Secret
        run: |
          kubectl create secret generic chat-secret \
            --from-literal=DB_USERNAME="${{ secrets.MYSQL_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=REDIS_PASSWORD="" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # 7. Deployment 이미지 업데이트
      - name: Update Deployment image
        run: |
          kubectl set image deployment/chat-service \
            chat-service=${{ needs.build-and-push.outputs.backend-image }} \
            -n ${{ env.K8S_NAMESPACE }}
          
          # Frontend가 있다면
          # kubectl set image deployment/chat-frontend \
          #   chat-frontend=${{ needs.build-and-push.outputs.frontend-image }} \
          #   -n ${{ env.K8S_NAMESPACE }}

      # 8. Rollout 상태 확인
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/chat-service -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          # kubectl rollout status deployment/chat-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      # 9. 배포 확인
      - name: Verify deployment
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=chat-service
          
          echo "=== Service Status ==="
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          
          echo "=== Recent Events ==="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

      # 10. Rollback on failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/chat-service -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/chat-service -n ${{ env.K8S_NAMESPACE }}
