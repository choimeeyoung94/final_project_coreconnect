name: CI/CD Pipeline with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================
  # 1. 코드 검증 및 테스트 (PR 머지 전 검사)
  # ============================================
  test-and-validate:
    name: Code Validation & Testing
    runs-on: ubuntu-latest
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 설정 (Backend)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js 설정 (Frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. Backend 의존성 설치 및 빌드 검증
      - name: Build Backend
        working-directory: ./backend
        run: |
          chmod +x gradlew || true
          ./gradlew clean build -x test --no-daemon || ./gradlew clean build -x test --no-daemon

      # 5. Backend 단위 테스트 실행
      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          ./gradlew test --no-daemon || ./gradlew test --no-daemon
        continue-on-error: true  # 테스트 실패해도 다음 단계 진행 (경고용)

      # 6. Frontend 의존성 설치
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # 7. Frontend 빌드 검증
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # 8. Frontend 린터 검사 (ESLint)
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint || true
        continue-on-error: true  # 린터 경고는 배포를 막지 않음

      # 9. Docker Compose 빌드 검증
      - name: Validate Docker Compose
        run: |
          docker compose config
          docker compose build --no-cache || true

  # ============================================
  # 2. 배포 (검증 통과 후에만 실행)
  # ============================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-validate  # 검증 단계가 성공해야만 배포 실행
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # main 브랜치에 push할 때만 배포

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. .env 파일 생성
      - name: Create .env file
        run: |
          # 루트 .env (docker-compose.yml에서 사용)
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}" >> .env
          echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" >> .env
          echo "WEBSOCKET_ALLOWED_ORIGINS=${{ secrets.WEBSOCKET_ALLOWED_ORIGINS }}" >> .env
          echo "COOKIE_SECURE=${{ secrets.COOKIE_SECURE }}" >> .env
          echo "COOKIE_SAME_SITE=${{ secrets.COOKIE_SAME_SITE }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          # frontend/.env (frontend/src/shared/api/axiosConfig.js에서 사용)
          echo "VITE_API_SERVER_HOST=${{ secrets.ALLOWED_ORIGIN }}" >> frontend/.env
        
      # 3. EC2로 파일 전송 (플러그인-https://github.com/appleboy/ssh-action)
      - name: Copy file to EC2
        uses: appleboy/scp-action@v1
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./*"
          target: "/home/ubuntu/website"
          rm: false

      # 4. EC2에서 Docker Compose 실행 (플러그인-https://github.com/appleboy/ssh-action)
      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # website 디렉터리로 이동
            cd /home/ubuntu/website
            # 기존 컨테이너 강제 중지 및 삭제
            docker compose down --remove-orphans || true
            # 남아있는 컨테이너 강제 제거 (혹시 모를 경우 대비)
            docker rm -f boot-container nginx-container 2>/dev/null || true
            # 사용하지 않는 이미지 삭제
            docker image prune -f
            # Docker Compose 실행
            docker compose up --build -d
            # 잠시 대기 후 컨테이너 상태 확인
            sleep 5
            # Docker Compose 실행 로그
            docker compose logs --tail=50
