plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.goodee.coreconnect'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Docker 29 이상과 호환되는 Testcontainers 버전 (Spring Boot 3.3.5 기본값 1.19.8은 Docker 29에서 연결 실패)
ext['testcontainers.version'] = '1.21.4'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	// CI 환경에서 repo.maven.apache.org 접근이 차단(403)되는 경우를 대비한 미러
	maven { url = uri("https://repo1.maven.org/maven2") }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 서버 여러 대에서 같은 스케줄 작업이 한 번만 돌게 잠금 (Redis 사용, 테이블 불필요)
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.16.0'
	implementation 'org.springframework.session:spring-session-data-redis' // Redis 세션 공유 (K8s용)
	implementation 'org.springframework.boot:spring-boot-starter-actuator' // 헬스체크용
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.0.4')
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	implementation 'software.amazon.awssdk:s3'
	implementation 'com.sendgrid:sendgrid-java:4.9.3'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// 스웨거 세팅
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
	// H2 Database 제거 - 로컬에서도 MySQL 사용
	// runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers: 테스트 실행 시 Docker로 실제 MySQL·Redis를 띄워서 검증
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	// JWT 설정 추가
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
  runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.11.5'
  runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.11.5'
   
  // JavaMailSender 설정 후가
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  
  // === Lombok (test) 추가 ===
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
	
}

tasks.named('test') {
	// 운영은 BackendApplication.main()이 Asia/Seoul로 고정. 테스트는 main()을 안 거치므로 UTC 러너에서도 같게 맞춤
	systemProperty 'user.timezone', 'Asia/Seoul'
	// legacy 태그: 실제 개발 DB 데이터에 의존하는 테스트. 포함해서 돌리려면 -PincludeLegacy
	useJUnitPlatform {
		if (!project.hasProperty('includeLegacy')) {
			excludeTags 'legacy'
		}
	}
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add("-parameters")
}