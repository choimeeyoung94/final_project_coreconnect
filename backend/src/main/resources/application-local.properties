# ========================================
# 로컬 개발 환경 설정 (application-local.properties)
# ========================================
# 사용 방법:
# 1. IntelliJ IDEA: Run > Edit Configurations > Active profiles에 "local" 입력
# 2. 또는 application.properties의 spring.profiles.active=local로 변경
# ========================================

spring.config.activate.on-profile=local

# ========================================
# MySQL 로컬 데이터베이스 (Docker)
# ========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 로컬 MySQL (Docker로 실행)
spring.datasource.url=jdbc:mysql://localhost:3306/db_coreconnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=finalcoreconnect

# ========================================
# JPA/Hibernate 설정
# ========================================
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 로컬 개발용: create-drop (H2 in-memory는 매번 재생성)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ========================================
# 보안 모드 OFF (로컬 개발용)
# ========================================
security.mode=open

# ========================================
# Redis 비활성화 (선택사항)
# ========================================
# Redis가 없어도 실행되도록 설정
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
# Redis 연결 실패 시 무시
spring.data.redis.timeout=2000ms

# ========================================
# 외부 서비스 비활성화 (로컬 테스트용)
# ========================================
# AWS S3 (파일 업로드 기능은 에러 발생 가능)
cloud.aws.credentials.access-key=
cloud.aws.credentials.secret-key=
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=

# SendGrid (이메일 발송 기능은 에러 발생 가능)
sendgrid.api.key=
sendgrid.from.email=noreply@localhost
sendgrid.from.name=CoreConnect Local
sendgrid.reply.to=noreply@localhost

# 이메일 (비활성화)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# ========================================
# JWT 설정 (로컬용)
# ========================================
jwt.secret=local-development-secret-key-for-testing-only-do-not-use-in-production

# ========================================
# 쿠키 설정 (로컬용)
# ========================================
app.cookie.secure=false
app.cookie.same-site=Lax

# ========================================
# CORS & WebSocket 설정
# ========================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000

# ========================================
# 로깅 설정
# ========================================
logging.level.root=INFO
logging.level.com.goodee.coreconnect=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Actuator (Health Check)
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ========================================
# 파일 업로드 설정
# ========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ========================================
# 개발 도구
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

