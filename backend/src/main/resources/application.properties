# ========================================
# 기본 설정 파일 (application.properties)
# ========================================
# 이 파일은 모든 환경에서 공통으로 사용되는 설정입니다
# 환경별 설정은 application-{profile}.properties에 작성하세요
# ========================================

# ========================================
# 활성 프로파일 설정
# ========================================
# 기본값: 프로파일 지정 없음 (배포 환경에서는 환경 변수로 DB 설정이 주입됨)
# 로컬 개발: IntelliJ/STS에서 Run Configuration > Active profiles에 "local" 입력
# docker-compose는 환경 변수(SPRING_DATASOURCE_*)로 DB 설정을 오버라이드합니다
# spring.profiles.active=local  <- 로컬 개발자는 IDE에서 직접 설정

# ========================================
# 애플리케이션 기본 정보
# ========================================
spring.application.name=coreconnect

# ========================================
# 데이터베이스 설정 (기본값 - docker-compose에서 오버라이드됨)
# ========================================
# docker-compose.yml의 environment에서 다음 환경 변수로 설정됩니다:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql-master:3306/db_coreconnect?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=finalcoreconnect

# ========================================
# JPA/Hibernate 기본 설정
# ========================================
spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=update

# ========================================
# Jackson 타임존 설정
# ========================================
spring.jackson.time-zone=Asia/Seoul

# ========================================
# MyBatis 설정
# ========================================
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.type-aliases-package=com.goodee.coreconnect
mybatis.configuration.map-underscore-to-camel-case=true

# ========================================
# JWT 설정 (배포 환경에서는 환경 변수로 오버라이드됨)
# ========================================
jwt.secret=${JWT_SECRET_KEY:your-default-secret-key-change-in-production}

# ========================================
# 쿠키 보안 설정
# ========================================
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ========================================
# CORS & WebSocket 설정
# ========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ========================================
# AWS S3 설정
# ========================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_BUCKET_NAME:}

# ========================================
# SendGrid 설정
# ========================================
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:admin@coreconnect.io.kr}
sendgrid.from.name=${SENDGRID_FROM_NAME:CoreConnect}
sendgrid.reply.to=${SENDGRID_REPLY_TO:admin@coreconnect.io.kr}

# ========================================
# 이메일 설정
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================================
# 파일 업로드 설정
# ========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ========================================
# Spring Boot Actuator 설정
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ========================================
# SpringDoc 설정
# ========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.goodee.coreconnect
springdoc.swagger-ui.use-root-path=false

# ========================================
# 로깅 설정
# ========================================
logging.level.org.hibernate.tool.schema.internal=DEBUG

# ========================================
# 개발 도구 설정
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
