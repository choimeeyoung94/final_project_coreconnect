spring:
  # ==========================================
  # 🔵 Master-Slave 데이터베이스 설정
  # ==========================================
  datasource:
    # Master DataSource (Write 전용)
    master:
      hikari:
        jdbc-url: ${SPRING_DATASOURCE_MASTER_URL:jdbc:mysql://mysql-master:3306/db_coreconnect?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:finalcoreconnect}
        driver-class-name: com.mysql.cj.jdbc.Driver
        
        # Connection Pool 크기 (Master는 Write 작업이므로 적절한 크기 유지)
        maximum-pool-size: 30          # Write 작업용 풀 크기
        minimum-idle: 10               # 최소 유휴 커넥션
        
        # 타임아웃 설정
        connection-timeout: 15000      # 15초
        idle-timeout: 300000           # 5분
        max-lifetime: 1200000          # 20분
        
        # 모니터링 및 검증
        leak-detection-threshold: 60000 # 1분
        connection-test-query: SELECT 1
        validation-timeout: 5000       # 5초
        pool-name: MasterDB-Pool
    
    # Slave DataSource (Read 전용)
    slave:
      hikari:
        jdbc-url: ${SPRING_DATASOURCE_SLAVE_URL:jdbc:mysql://mysql-slave-1:3306/db_coreconnect?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:finalcoreconnect}
        driver-class-name: com.mysql.cj.jdbc.Driver
        
        # Connection Pool 크기 (Read 작업이 많으므로 더 큰 풀 크기)
        maximum-pool-size: 50          # Read 작업용 풀 크기 (Master보다 크게)
        minimum-idle: 15               # 최소 유휴 커넥션
        
        # 타임아웃 설정
        connection-timeout: 15000      # 15초
        idle-timeout: 300000           # 5분
        max-lifetime: 1200000          # 20분
        
        # 모니터링 및 검증
        leak-detection-threshold: 60000 # 1분
        connection-test-query: SELECT 1
        validation-timeout: 5000       # 5초
        pool-name: SlaveDB-Pool
  
  # Redis 설정
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: "1111"
      timeout: 2000ms
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: false
        generate_statistics: true

# ==========================================
# Tomcat Thread Pool 설정
# ==========================================
server:
  # 서버 커넥션 타임아웃 (LB/프록시와 Idle Timeout 맞춰 확인)
  connection-timeout: 30s
  tomcat:
    threads:
      max: 200                      # 최대 스레드 수 (동일 유지)
      min-spare: 30                 # 최소 유휴 스레드 (부하 테스트용 약간 축소)
    accept-count: 150               # 요청 대기 큐 크기 (버스트 대응 약간 확대)
    max-connections: 10000          # 최대 동시 연결 수 (동일 유지)

  # HTTP 응답 압축 (전송 최적화)
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024  # 1KB 이상부터 압축

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG