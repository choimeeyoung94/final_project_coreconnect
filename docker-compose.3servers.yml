version: '3.8'

# ================================================================
# 3대 서버 축소 버전 (로컬 테스트용)
# 3대 × 10,000명 = 30,000명 동시 접속 지원
# ================================================================

networks:
  chat-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

services:
  # ================================================================
  # 1️⃣ Nginx Load Balancer
  # ================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-3servers.conf:/etc/nginx/nginx.conf:ro
    networks:
      - chat-network
    depends_on:
      - chat-app-1
      - chat-app-2
      - chat-app-3
    restart: unless-stopped

  # ================================================================
  # 2️⃣ Spring Boot Servers (3대)
  # ================================================================
  chat-app-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chat-server:latest
    container_name: chat-app-1
    hostname: chat-app-1
    ports:
      - "8081:8080"
    environment:
      - SERVER_ID=1
      - MAX_CONNECTIONS=10000
      - REDIS_HOST=redis-pubsub
      - MYSQL_HOST=mysql
    networks:
      - chat-network
    depends_on:
      - redis-pubsub
      - mysql
    restart: unless-stopped

  chat-app-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chat-server:latest
    container_name: chat-app-2
    hostname: chat-app-2
    ports:
      - "8082:8080"
    environment:
      - SERVER_ID=2
      - MAX_CONNECTIONS=10000
      - REDIS_HOST=redis-pubsub
      - MYSQL_HOST=mysql
    networks:
      - chat-network
    depends_on:
      - redis-pubsub
      - mysql
    restart: unless-stopped

  chat-app-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chat-server:latest
    container_name: chat-app-3
    hostname: chat-app-3
    ports:
      - "8083:8080"
    environment:
      - SERVER_ID=3
      - MAX_CONNECTIONS=10000
      - REDIS_HOST=redis-pubsub
      - MYSQL_HOST=mysql
    networks:
      - chat-network
    depends_on:
      - redis-pubsub
      - mysql
    restart: unless-stopped

  # ================================================================
  # 3️⃣ Redis Pub/Sub
  # ================================================================
  redis-pubsub:
    image: redis:7.2-alpine
    container_name: chat-redis-pubsub
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chat-network
    restart: unless-stopped

  # ================================================================
  # 4️⃣ MySQL
  # ================================================================
  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Chat@2024!Secure
      - MYSQL_DATABASE=db_coreconnect
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chat-network
    restart: unless-stopped






















