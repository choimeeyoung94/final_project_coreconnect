version: '3.8'

# ============================================================
# K6 부하 테스트 모니터링 환경
# InfluxDB + Grafana + K6
# ============================================================

services:
  # InfluxDB - 시계열 데이터베이스 (K6 메트릭 저장)
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    networks:
      - k6-network
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - 대시보드 및 시각화
  grafana:
    image: grafana/grafana:latest
    container_name: k6-grafana
    networks:
      - k6-network
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # K6 - 부하 테스트 실행 (선택적)
  k6:
    image: grafana/k6:latest
    container_name: k6-runner
    networks:
      - k6-network
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=http://host.docker.internal:8080
      - WS_URL=ws://host.docker.internal:8080
      - TEST_ROOM_ID=1
      - TOTAL_USERS=100000
      - RAMP_UP_TIME=5m
      - STEADY_TIME=10m
      - RAMP_DOWN_TIME=2m
    volumes:
      - ./performance-tests:/scripts
    depends_on:
      - influxdb
    # 자동 실행하지 않음 (수동으로 테스트 시작)
    # command: run /scripts/massive-chat-load-test.js
    entrypoint: ["tail", "-f", "/dev/null"]  # 컨테이너를 계속 실행 상태로 유지
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker 내부에서 호스트 접근

networks:
  k6-network:
    driver: bridge

volumes:
  influxdb-data:
    driver: local
  grafana-data:
    driver: local

