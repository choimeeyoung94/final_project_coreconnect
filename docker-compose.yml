services:
  # 1. MySQL 서비스 추가 ⭐
  mysql:
    container_name: mysql-container
    image: mysql:8.0
    networks:
      - my-network
    ports:
      - "3306:3306"
    expose:
      - "3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      # ⭐ 데이터 영구 저장 (컨테이너 삭제해도 데이터 보존)
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. backend 서비스 생성
  backend:
    # 1) 도커 컨테이너 이름
    container_name: boot-container
    # 2) ./backend 경로에 있는 Dockerfile로 도커 이미지를 빌드할 것
    build: 
      context: ./backend
    # 3) 이미 존재하는 외부 네트워크를 사용
    networks:
      - my-network
    # 4) 포트 매핑: 호스트 8080 -> 컨테이너 8080 (부하 테스트를 위해 외부 접근 허용)
    ports:
      - "8080:8080"
    # 컨테이너 간 통신도 유지
    expose:
      - "8080"
    # 5) 재시작 정책: 수동으로 중지하지 않는 한 항상 재시작
    restart: unless-stopped
    # 6) MySQL 서비스가 준비될 때까지 대기 ⭐
    depends_on:
      mysql:
        condition: service_healthy
    # 7) Healthcheck: 커스텀 /api/health 엔드포인트 사용
    # Rolling Update 시 새 컨테이너가 완전히 준비될 때까지 대기
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    # 8) docker-compose를 사용하면 Dockerfile를 통하지 않아도 환경 변수를 직접 컨테이너(boot-container)로 전달 가능
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://coreconnect.io.kr}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://coreconnect.io.kr}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-admin@coreconnect.io.kr}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-CoreConnect}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-admin@coreconnect.io.kr}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
  
  # 2. frontend 서비스 생성
  frontend:
    # 1) 도커 컨테이너 이름
    container_name: nginx-container
    # 2) ./frontend 경로에 있는 Dockerfile로 도커 이미지를 빌드할 것
    build: 
      context: ./frontend
    # 3) 포트 포워딩 (HTTP 80, HTTPS 443)
    ports:
      - 80:80
      - 443:443
    # 4) boot-container와 동일한 도커 네트워크 사용
    networks:
      - my-network
    # 5) 재시작 정책: 수동으로 중지하지 않는 한 항상 재시작
    restart: unless-stopped
    # 6) Let's Encrypt 인증서 볼륨 마운트 (HTTPS 사용 시에만 주석 해제)
    # ⚠️ 주의: HTTPS를 사용하지 않는다면 아래 볼륨을 주석 처리해야 합니다.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/letsencrypt-challenge:/usr/share/nginx/html/.well-known/acme-challenge
    # 7) backend 서비스가 시작될 때까지 대기 (healthcheck 조건 완화)
    depends_on:
      - backend
      # backend:
      #   condition: service_healthy  # ⚠️ 임시로 주석 처리 (curl 없는 경우)

# 외부 네트워크 사용 (도커 네트워크 my-network는 도커 컴포즈 실행 전에 미리 만들어 두어야 함)
networks:
  my-network:
    external: true

# MySQL 데이터 영구 저장을 위한 볼륨
volumes:
  mysql-data:
    driver: local