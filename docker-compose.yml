  # ================================================================
  # 3️⃣ Redis Pub/Sub (메시지 동기화)
  # ================================================================
  redis-pubsub:
    image: redis:7.2-alpine
    container_name: chat-redis-pubsub
    hostname: redis-pubsub
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --daemonize no
      --loglevel notice
    volumes:
      - redis-pubsub-data:/data
    networks:
      chat-network:
        ipv4_address: 172.20.0.40
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================================
  # 4️⃣ Redis Session (세션 클러스터링)
  # ================================================================
  redis-session:
    image: redis:7.2-alpine
    container_name: chat-redis-session
    hostname: redis-session
    ports:
      - "6380:6380"
    command: >
      redis-server
      --port 6380
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --daemonize no
      --loglevel notice
    volumes:
      - redis-session-data:/data
    networks:
      chat-network:
        ipv4_address: 172.20.0.41
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================================
  # 5️⃣ MySQL Master (Write)
  # ================================================================
  mysql-master:
    image: mysql:8.0
    container_name: chat-mysql-master
    hostname: mysql-master
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Chat@2024!Secure}
      - MYSQL_DATABASE=db_coreconnect
      - MYSQL_REPLICATION_MODE=master
      - MYSQL_REPLICATION_USER=repl_user
      - MYSQL_REPLICATION_PASSWORD=${MYSQL_REPLICATION_PASSWORD:-Repl@2024!Pass}
      - TZ=Asia/Seoul
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=db_coreconnect
      --max-connections=1000
      --innodb-buffer-pool-size=2G
      --innodb-log-file-size=512M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=256M
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --query-cache-size=0
      --query-cache-type=0
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      chat-network:
        ipv4_address: 172.20.0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ================================================================
  # 6️⃣ MySQL Slave 1 (Read)
  # ================================================================
  mysql-slave-1:
    image: mysql:8.0
    container_name: chat-mysql-slave-1
    hostname: mysql-slave-1
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Chat@2024!Secure}
      - MYSQL_DATABASE=db_coreconnect
      - MYSQL_REPLICATION_MODE=slave
      - MYSQL_MASTER_HOST=mysql-master
      - MYSQL_MASTER_PORT=3306
      - MYSQL_REPLICATION_USER=repl_user
      - MYSQL_REPLICATION_PASSWORD=${MYSQL_REPLICATION_PASSWORD:-Repl@2024!Pass}
      - TZ=Asia/Seoul
    command: >
      --server-id=2
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=db_coreconnect
      --read-only=1
      --max-connections=1000
      --innodb-buffer-pool-size=2G
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=256M
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --query-cache-size=0
      --query-cache-type=0
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-slave1-data:/var/lib/mysql
    networks:
      chat-network:
        ipv4_address: 172.20.0.51
    depends_on:
      mysql-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ================================================================
  # 7️⃣ MySQL Slave 2 (Read)
  # ================================================================
  mysql-slave-2:
    image: mysql:8.0
    container_name: chat-mysql-slave-2
    hostname: mysql-slave-2
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Chat@2024!Secure}
      - MYSQL_DATABASE=db_coreconnect
      - MYSQL_REPLICATION_MODE=slave
      - MYSQL_MASTER_HOST=mysql-master
      - MYSQL_MASTER_PORT=3306
      - MYSQL_REPLICATION_USER=repl_user
      - MYSQL_REPLICATION_PASSWORD=${MYSQL_REPLICATION_PASSWORD:-Repl@2024!Pass}
      - TZ=Asia/Seoul
    command: >
      --server-id=3
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=db_coreconnect
      --read-only=1
      --max-connections=1000
      --innodb-buffer-pool-size=2G
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=256M
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --query-cache-size=0
      --query-cache-type=0
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-slave2-data:/var/lib/mysql
    networks:
      chat-network:
        ipv4_address: 172.20.0.52
    depends_on:
      mysql-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ================================================================
  # 8️⃣ Prometheus (메트릭 수집)
  # ================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: chat-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      chat-network:
        ipv4_address: 172.20.0.60
    depends_on:
      - chat-app-1
      - chat-app-2
      - chat-app-3
      - chat-app-4
      - chat-app-5
      - chat-app-6
      - chat-app-7
      - chat-app-8
      - chat-app-9
      - chat-app-10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================================
  # 9️⃣ Grafana (모니터링 대시보드)
  # ================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: chat-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=redis-datasource,mysql-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - TZ=Asia/Seoul
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      chat-network:
        ipv4_address: 172.20.0.61
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================================
  # 🔟 Redis Commander (선택 사항 - Redis GUI)
  # ================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: chat-redis-commander
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=pubsub:redis-pubsub:6379,session:redis-session:6380
      - HTTP_USER=admin
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin123}
    networks:
      chat-network:
        ipv4_address: 172.20.0.70
    depends_on:
      - redis-pubsub
      - redis-session
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
