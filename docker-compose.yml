version: '3.8'

# ================================================================
# 10만명 동시접속 채팅방 - Docker Compose 구성
# ================================================================

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql-master-data:
    driver: local
  mysql-slave1-data:
    driver: local
  mysql-slave2-data:
    driver: local
  redis-pubsub-data:
    driver: local
  redis-session-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ================================================================
  # 1️⃣ Nginx Load Balancer
  # ================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: chat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      chat-network:
        ipv4_address: 172.20.0.10
    depends_on:
      - chat-app-1
      - chat-app-2
      - chat-app-3
      - chat-app-4
      - chat-app-5
      - chat-app-6
      - chat-app-7
      - chat-app-8
      - chat-app-9
      - chat-app-10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================================================
  # 2️⃣ Spring Boot Chat Servers (10대)
  # ================================================================
  
  # Server #1
  chat-app-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - VCS_REF=${VCS_REF:-unknown}
    image: chat-server:latest
    container_name: chat-app-1
    hostname: chat-app-1
    ports:
      - "8081:8080"
      - "9091:9090"  # JMX
    environment:
      - SERVER_ID=1
      - SERVER_PORT=8080
      - MAX_CONNECTIONS=10000
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis-pubsub
      - REDIS_PORT=6379
      - REDIS_SESSION_HOST=redis-session
      - REDIS_SESSION_PORT=6380
      - MYSQL_HOST=mysql-master
      - MYSQL_PORT=3306
      - MYSQL_SLAVE_HOST=mysql-slave-1
      - MYSQL_SLAVE_PORT=3306
      - MYSQL_DATABASE=db_coreconnect
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-Chat@2024!Secure}
      - JAVA_OPTS=-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
    networks:
      chat-network:
        ipv4_address: 172.20.0.21
    depends_on:
      redis-pubsub:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      mysql-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

