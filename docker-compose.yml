services:
  # 1. backend 서비스 생성
  backend:
    # 1) 도커 컨테이너 이름
    container_name: boot-container
    # 2) ./backend 경로에 있는 Dockerfile로 도커 이미지를 빌드할 것
    build: 
      context: ./backend
    # 3) 이미 존재하는 외부 네트워크를 사용
    networks:
      - my-network
    # 4) 컨테이너 간의 통신만 허용 (외부에서 8080으로 직접 접속할 수 없어 보안 향상)
    expose:
      - "8080"
    # 5) Healthcheck: Spring Boot 애플리케이션이 완전히 시작될 때까지 대기
    # TCP 포트 체크로 8080 포트가 열려있는지 확인 (nc는 alpine 이미지에 기본 포함)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    # 6) docker-compose를 사용하면 Dockerfile를 통하지 않아도 환경 변수를 직접 컨테이너(boot-container)로 전달 가능
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
  
  # 2. frontend 서비스 생성
  frontend:
    # 1) 도커 컨테이너 이름
    container_name: nginx-container
    # 2) ./frontend 경로에 있는 Dockerfile로 도커 이미지를 빌드할 것
    build: 
      context: ./frontend
    # 3) 포트 포워딩 (HTTP 80, HTTPS 443)
    ports:
      - 80:80
      - 443:443
    # 4) boot-container와 동일한 도커 네트워크 사용
    networks:
      - my-network
    # 5) Let's Encrypt 인증서 볼륨 마운트 (호스트의 /etc/letsencrypt 디렉토리)
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/letsencrypt-challenge:/usr/share/nginx/html/.well-known/acme-challenge
    # 6) backend 서비스가 완전히 준비될 때까지 대기
    depends_on:
      backend:
        condition: service_healthy

# 외부 네트워크 사용 (도커 네트워크 my-network는 도커 컴포즈 실행 전에 미리 만들어 두어야 함)
networks:
  my-network:
    external: true