# ============================================================
# Grafana Dashboard 설정
# ============================================================

apiVersion: 1

providers:
  - name: 'K6 Load Test Dashboards'
    orgId: 1
    folder: 'K6'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

