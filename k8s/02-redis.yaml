apiVersion: v1
kind: Service
metadata:
  name: redis-pubsub
  namespace: chat-system
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis-pubsub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-pubsub
  namespace: chat-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-pubsub
  template:
    metadata:
      labels:
        app: redis-pubsub
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command:
          - redis-server
          - --maxmemory
          - 2gb
          - --maxmemory-policy
          - allkeys-lru
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5


