apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: chat-system
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: chat-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: chat-system
spec:
  replicas: 2  # ✅ 개발용 2개로 축소 (비용 80% 절감)
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      containers:
      - name: chat-server
        image: chat-server:latest
        imagePullPolicy: Never
        env:
        - name: SERVER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVER_PORT
          value: "8080"
        - name: MAX_CONNECTIONS
          value: "5000"  # 개발용으로 축소
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: REDIS_HOST
          value: "redis-pubsub"
        - name: REDIS_PORT
          value: "6379"
        - name: MYSQL_HOST
          value: "mysql"
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: "db_coreconnect"
        - name: MYSQL_USERNAME
          value: "root"
        - name: MYSQL_PASSWORD
          value: "Chat@2024!Secure"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1g -XX:+UseG1GC"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "512Mi"   # 1Gi → 512Mi (비용 절감)
            cpu: "250m"       # 500m → 250m (비용 절감)
          limits:
            memory: "1Gi"     # 2Gi → 1Gi
            cpu: "500m"       # 1000m → 500m
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3


