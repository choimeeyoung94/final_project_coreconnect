# Redis Cluster for Chat System
# 고가용성을 위한 3 Master + 3 Replica 구성
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: chat-system
data:
  redis.conf: |
    # ⭐ Redis Cluster 설정
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    
    # ⭐ 성능 최적화
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    
    # ⭐ Persistence (RDB + AOF)
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    
    # ⭐ 네트워크 최적화
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # ⭐ 로깅
    loglevel notice
    logfile ""

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: chat-system
  labels:
    app: redis-cluster
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  selector:
    app: redis-cluster

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: chat-system
spec:
  serviceName: redis-cluster
  replicas: 6  # ⭐ 3 Master + 3 Replica
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      # ⭐ Pod Anti-Affinity (서로 다른 노드에 배포)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis-cluster
            topologyKey: kubernetes.io/hostname
      
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command:
        - redis-server
        args:
        - /conf/redis.conf
        - --cluster-announce-ip
        - $(POD_IP)
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: conf
          mountPath: /conf
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
          items:
          - key: redis.conf
            path: redis.conf
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd  # ⭐ SSD 스토리지 사용
      resources:
        requests:
          storage: 20Gi

---
# Redis Cluster 초기화 Job
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: chat-system
spec:
  template:
    spec:
      containers:
      - name: redis-init
        image: redis:7.0-alpine
        command:
        - /bin/sh
        - -c
        - |
          # Pod들이 모두 준비될 때까지 대기
          sleep 30
          
          # Redis Cluster 생성
          redis-cli --cluster create \
            redis-cluster-0.redis-cluster.chat-system.svc.cluster.local:6379 \
            redis-cluster-1.redis-cluster.chat-system.svc.cluster.local:6379 \
            redis-cluster-2.redis-cluster.chat-system.svc.cluster.local:6379 \
            redis-cluster-3.redis-cluster.chat-system.svc.cluster.local:6379 \
            redis-cluster-4.redis-cluster.chat-system.svc.cluster.local:6379 \
            redis-cluster-5.redis-cluster.chat-system.svc.cluster.local:6379 \
            --cluster-replicas 1 \
            --cluster-yes
          
          echo "Redis Cluster 초기화 완료!"
      restartPolicy: OnFailure










