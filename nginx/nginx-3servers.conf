# ================================================================
# Nginx Load Balancer for 3 Chat Servers (로컬 테스트용)
# 3만명 동시접속 지원 (3대 × 10,000명)
# ================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "upstream: $upstream_addr"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ================================================================
    # 업스트림 서버 (3대)
    # ================================================================
    upstream chat_servers {
        least_conn;
        
        server chat-app-1:8080 max_fails=3 fail_timeout=30s weight=1;
        server chat-app-2:8080 max_fails=3 fail_timeout=30s weight=1;
        server chat-app-3:8080 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 100;
    }

    # ================================================================
    # HTTP 서버
    # ================================================================
    server {
        listen 80;
        
        # Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx 상태
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # WebSocket
        location /ws {
            proxy_pass http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # API
        location /api {
            proxy_pass http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # Default
        location / {
            proxy_pass http://chat_servers;
            proxy_set_header Host $host;
        }
    }
}

